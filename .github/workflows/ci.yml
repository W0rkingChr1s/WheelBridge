name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # 3.11 = Raspberry Pi OS Bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten
        run: pip install evdev pyusb
      - name: Syntax
        run: python -m py_compile bridge/*.py
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v

  shell:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning install.sh scripts/wheelbridge scripts/doctor.sh
      - name: Unix-Zeilenenden
        run: |
          if grep -lU $'\r' install.sh scripts/* bridge/*.py config.toml; then
            echo "::error::CRLF-Zeilenenden gefunden – 'curl | bash' würde scheitern"; exit 1
          fi
