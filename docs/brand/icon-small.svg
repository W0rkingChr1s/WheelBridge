<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>WheelBridge (Favicon)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b232e"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="326">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="span" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Kachel -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Brücke: Bogen mit Hängern über der Fahrbahn -->
  <g stroke="url(#span)" stroke-linecap="round" fill="none">
    <path d="M112 396 Q256 266 400 396" stroke-width="26"/>
    <line x1="72" y1="396" x2="440" y2="396" stroke-width="30"/>
  </g>
  <!-- Endpunkte: Lenkrad-Seite (grün) und Konsolen-Seite (blau) -->
  <circle cx="72" cy="396" r="30" fill="#3fb950"/>
  <circle cx="440" cy="396" r="30" fill="#58a6ff"/>
  <circle cx="72" cy="396" r="9" fill="#0b0f14"/>
  <circle cx="440" cy="396" r="9" fill="#0b0f14"/>

  <!-- Lenkrad, ruht auf dem Bogenscheitel -->
  <g stroke-linecap="round">
    <line x1="256" y1="196" x2="150" y2="210" stroke="url(#rim)" stroke-width="30"/>
    <line x1="256" y1="196" x2="362" y2="210" stroke="url(#rim)" stroke-width="30"/>
    <line x1="256" y1="196" x2="256" y2="296" stroke="url(#rim)" stroke-width="30"/>
  </g>
  <circle cx="256" cy="196" r="112" fill="none" stroke="url(#rim)" stroke-width="42"/>
  <circle cx="256" cy="200" r="38" fill="#2ea043"/>
  <circle cx="256" cy="200" r="16" fill="#0b0f14" fill-opacity=".55"/>
  <!-- Mittelmarkierung oben am Kranz -->
  <rect x="246" y="66" width="20" height="40" rx="5" fill="#f0f3f6"/>
</svg>
